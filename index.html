<!DOCTYPE html>
<html lang="en">
<head>

<title>Vocab Cards</title>
<style>
:root{--bg:#000;--tile:#262628;--tile2:#161617;--line:#3a3a3d;--tx:#fff;--mut:#a9a9ae;--btn:#cfcfd4;--btnt:#111;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="light"]{--bg:#f4f4f6;--tile:#fff;--tile2:#ececf0;--line:#d2d2d8;--tx:#111;--mut:#666;--btn:#222;--btnt:#fff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 120px;max-width:560px;margin:0 auto}
h1{font:600 30px Georgia,serif;margin:6px 0 4px}h2{font-size:20px;margin:22px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:linear-gradient(160deg,var(--tile),var(--tile2));border:1px solid var(--line);border-radius:24px;padding:18px 10px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--tx);font:inherit;cursor:pointer}
.tile b{font-size:17px}.tile small{color:var(--mut);margin-top:4px}
.letter{min-height:72px;padding:10px 4px;border-radius:20px}.letter b{font-size:24px}.letter.off{opacity:.35}
.btn{background:var(--btn);color:var(--btnt);border:0;border-radius:18px;padding:13px 22px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:var(--tile);color:var(--tx);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.strip button{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--tile);color:var(--tx);font:600 15px inherit;font-family:inherit}
.strip button.on{background:var(--btn);color:var(--btnt)}
.strip button.off{opacity:.35}
.card{display:block;width:100%;text-align:left;background:linear-gradient(160deg,var(--tile),var(--tile2));border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:12px;color:var(--tx);font:inherit;cursor:pointer;transition:transform .15s}
.card.flip{transform:rotateY(90deg)}
.card .w{font:600 26px Georgia,serif;text-align:center;padding:14px 0}
.card .hint{text-align:center;color:var(--mut);font-size:13px}
.pos{display:inline-block;background:var(--line);border-radius:10px;padding:2px 10px;font-size:13px;margin-bottom:8px;color:var(--mut)}
.k{color:var(--mut);font-size:13px;margin-top:10px}
.back p{margin:2px 0}
input,textarea,select{width:100%;background:var(--tile);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:13px;font:16px inherit;font-family:inherit;margin:4px 0 12px}
textarea{min-height:110px;resize:vertical}
label{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chips button{border-radius:14px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:8px 14px;font:15px inherit;font-family:inherit}
.chips button.on{background:var(--btn);color:var(--btnt)}
.empty{color:var(--mut);text-align:center;padding:30px 0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 2px;margin-bottom:10px;border-bottom:1px solid var(--line)}.mini{display:flex;gap:6px;margin-bottom:8px}.mini button{flex:1;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:7px 4px;font:600 13px inherit;font-family:inherit;cursor:pointer}.bar .strip{padding:0 0 8px;gap:5px}.bar .strip button{width:30px;height:32px;border-radius:10px;font-size:13px}.cards{align-items:start;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}.cards .card{margin:0;aspect-ratio:1/1.2;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px}.cards .hint{display:none}.cards .card .w{padding:2px 0;font-size:17px;word-break:break-word;text-align:center}.cards .card.back{aspect-ratio:1/1.2;gap:5px;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;line-height:1.25;overflow-wrap:anywhere}.cards .card.back p{font-size:13px;margin:0}.cards .card.back .ex{font-style:italic;font-size:10px;line-height:1.2;color:var(--tx);margin:0}.cards .card.back .mean{background:#fff;color:#111;font-weight:700;font-size:11px;line-height:1.15;border-radius:9px;padding:3px 9px;margin:0;overflow-wrap:normal;word-break:normal;width:auto;max-width:100%;flex:0 0 auto;min-height:0;display:flex;align-items:center;justify-content:center}.cards .card.back .sy{font-size:10px;margin:0;background:#1c2a6b;color:#fff;border-radius:10px;padding:2px 9px}.cards .card.back .an{background:#6b1a2b}.cards .card.back .row{margin-top:6px;gap:6px}.cards .card.back .k{margin-top:6px;font-size:10px}.cards .card.back .pos{font-size:10px;margin:0;padding:2px 9px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.ov .card{max-width:420px;width:100%;margin:0;animation:fl .2s}@keyframes fl{from{transform:rotateY(90deg)}to{transform:none}}.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.sheet{background:var(--tile);border:1px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;text-align:center}.sheet b{font:600 22px Georgia,serif;margin-bottom:4px}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:8px 4px;font:600 14px inherit;font-family:inherit;cursor:pointer}.tabs button.on{background:var(--btn);color:var(--btnt)}.nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--tile);border:1px solid var(--line);border-radius:36px;padding:8px;display:flex;gap:6px;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.45)}.nav button{flex:1;height:52px;border:0;background:transparent;border-radius:28px;font-size:24px;cursor:pointer;color:var(--tx)}.nav button.on{background:var(--btn)}.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;padding:0;font-size:10px;font-weight:600;font-family:inherit}.nav button.on{color:var(--btnt)}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.cards .card.act{aspect-ratio:1/1.2;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;padding:8px;cursor:pointer}.card.act button{border:1px solid var(--line);background:var(--tile);color:var(--tx);border-radius:12px;padding:7px 4px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer}.card.act button.pri{background:var(--btn);color:var(--btnt)}.card.act button.dng{color:#ff8a8a}.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 18px;border-radius:16px;font-weight:600}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px}.vrow .sub{margin:0}.vt{display:flex;gap:4px}.vt button{border-radius:12px;border:1px solid var(--line);background:var(--tile);color:var(--tx);padding:7px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}.vt button.on{background:var(--btn);color:var(--btnt)}
.pad{border-top:1px solid var(--line)}.nl{border-bottom:1px solid var(--line)}.nh{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;border:0;color:var(--tx);font:600 20px Georgia,serif;padding:14px 4px;text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none}.nh .chev{color:var(--mut);font:22px system-ui;transition:transform .15s}.nl.open .chev{transform:rotate(90deg)}.nl.open{background:linear-gradient(160deg,var(--tile),var(--tile2));border:1px solid var(--line);border-radius:18px;margin:6px 0;padding:0 12px}.nd{padding:0 4px 14px}.nd>div{margin-top:8px}.tm{display:inline-block;background:#fff;color:#111;font-weight:700;font-size:15px;border-radius:10px;padding:4px 11px}.ts{display:inline-block;background:#1c2a6b;color:#fff;border-radius:10px;padding:3px 11px;font-size:14px}.ts.ta{background:#6b1a2b}.nex{font-style:italic;color:var(--mut);margin:10px 0 0;font-size:15px}.nd .btn{padding:9px 16px;font-size:14px;border-radius:14px}.nd .btn.dn{color:#ff8a8a}
.cards .card.cp{border-style:dashed}
.nline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tp{border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:3px 11px;font-size:13px}.tpr{display:inline-block;background:#0f4c4a;color:#fff;border-radius:10px;padding:3px 11px;font-size:14px}
.card{position:relative}.say{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--tile);color:var(--tx);cursor:pointer;padding:0;flex:none}.card .say{position:absolute;top:8px;right:8px}.nhr{display:flex;align-items:center;gap:6px}.nhr .nh{flex:1;width:auto}
</style>
</head>
<body>
<div id="app"></div>
<script>
var KEY="vocabcards.v1",POS=["noun","verb","adjective","adverb","other"];
var words=[],view={s:"home"},flipped={},tab="p",VMK="vocabcards.vm",vm="c";
try{vm=localStorage.getItem(VMK)==="n"?"n":"c"}catch(e){vm="c"}
try{words=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){words=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var SCm={a:"ᴀ",b:"ʙ",c:"ᴄ",d:"ᴅ",e:"ᴇ",f:"ꜰ",g:"ɢ",h:"ʜ",i:"ɪ",j:"ᴊ",k:"ᴋ",l:"ʟ",m:"ᴍ",n:"ɴ",o:"ᴏ",p:"ᴘ",q:"ǫ",r:"ʀ",s:"ꜱ",t:"ᴛ",u:"ᴜ",v:"ᴠ",w:"ᴡ",x:"x",y:"ʏ",z:"ᴢ"};
function sc(s){return String(s==null?"":s).toLowerCase().replace(/[a-z]/g,function(c){return SCm[c]})}
function scDom(r){var tw=document.createTreeWalker(r,NodeFilter.SHOW_TEXT,null),n,a=[];while(n=tw.nextNode()){var p=n.parentNode;if(p&&/^(TEXTAREA|INPUT|SCRIPT|STYLE)$/.test(p.tagName))continue;a.push(n)}a.forEach(function(n){n.nodeValue=sc(n.nodeValue)})}
function inTab(w){return (w.st||"p")===tab}
var acting=null;
var lastArr=null,peek={};
function reflow(){if(!lastArr)return;var c=document.querySelector(".cards"),p=document.querySelector(".pad");if(c)c.innerHTML=orderList(lastArr).map(cardHtml).join("");else if(p)p.innerHTML=orderList(lastArr).map(lineHtml).join("")}
function terms(x){return String(x||"").toLowerCase().split(/[,;]/).map(function(t){return t.trim()}).filter(Boolean)}
function share(a,b){return a.some(function(t){return b.indexOf(t)>-1})}
function related(a,b){var am=(a.m||"").trim().toLowerCase(),bm=(b.m||"").trim().toLowerCase(),as=terms(a.s),bs=terms(b.s),aa=terms(a.a),ba=terms(b.a),aw=(a.w||"").trim().toLowerCase(),bw=(b.w||"").trim().toLowerCase();return simil(am,bm)>=0.7||share(as,bs)||share(aa,ba)||bs.indexOf(aw)>-1||as.indexOf(bw)>-1}
function orderList(arr){var s=sorted(arr),f=null;s.forEach(function(w){if(flipped[w.id])f=w});if(!f)return s;var g=s.filter(function(x){return x.id!==f.id&&related(f,x)}).map(function(x){return Object.assign({},x,{_cp:1})}),i=s.indexOf(f);return s.slice(0,i+1).concat(g,s.slice(i+1))}
function simil(a,b){if(!a||!b)return 0;if(a===b)return 1;var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=n;j++)d[0][j]=j;for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[m][n]/Math.max(m,n)}
function synOf(w){var a=(w.s||"").split(",").map(function(x){return x.trim()}).filter(Boolean),k=(w.m||"").trim().toLowerCase();words.forEach(function(z){if(z.id!==w.id&&simil((z.m||"").trim().toLowerCase(),k)>=0.7)a.push(z.w)});var seen={};return a.filter(function(x){var l=x.toLowerCase();if(seen[l])return false;seen[l]=1;return true}).join(", ")}
function flipTo(id){var el=document.getElementById("c"+id),w=words.filter(function(z){return z.id===id})[0];if(!el||!w)return;el.classList.add("flip");setTimeout(function(){var t=document.createElement("div");t.innerHTML=cardHtml(w);var n=t.firstChild;n.classList.add("flip");el.replaceWith(n);requestAnimationFrame(function(){requestAnimationFrame(function(){n.classList.remove("flip")})})},150)}
function act(id){if(!id)return;var p=acting;acting=id;if(p&&p!==id)flipTo(p);flipTo(id)}
function sorted(l){return l.slice().sort(function(a,b){return a.w.toLowerCase().localeCompare(b.w.toLowerCase())})}
function first(w){var c=w.w.trim().charAt(0).toUpperCase();return/[A-Z]/.test(c)?c:"#"}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},1600)}
function go(s,x){view=Object.assign({s:s},x||{});render();window.scrollTo(0,0)}
function letters(){var L=[];for(var i=65;i<91;i++)L.push(String.fromCharCode(i));return L}
function counts(){var c={};words.forEach(function(w){var f=first(w);c[f]=(c[f]||0)+1});return c}
var SPK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function speak(t){try{if(!window.speechSynthesis)return toast("Speech not supported on this device");var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(x){toast("Speech not supported on this device")}}
function cardHtml(w){
 if(acting===w.id&&!w._cp)return '<div class="card act" id="c'+w.id+'" data-back="'+w.id+'"><button class="pri" data-mv="'+w.id+'">'+sc(w.st==="m"?"To Learning":"To Learned")+'</button><button data-edit="'+w.id+'">'+sc("Edit")+'</button><button class="dng" data-del="'+w.id+'">'+sc("Delete")+'</button></div>';
 var open=w._cp?peek[w.id]:flipped[w.id],cx=w._cp?' data-cp="1"':'',ci=w._cp?"x":"",cc=w._cp?" cp":"",spk='<span class="say" role="button" aria-label="Pronounce" data-say="'+esc(w.w)+'">'+SPK+'</span>';
 if(!open)return '<button class="card'+cc+'" data-flip="'+w.id+'"'+cx+' id="c'+w.id+ci+'"><div class="w">'+esc(sc(w.w))+'</div><div class="hint">Tap to flip</div>'+spk+'</button>';
 return '<button class="card back'+cc+'" data-flip="'+w.id+'"'+cx+' id="c'+w.id+ci+'"><p class="mean">'+esc(sc(w.m))+'</p></button>';
}
function strip(cur){var c=counts();return '<div class="strip">'+letters().map(function(l){return '<button class="'+(l===cur?'on':'')+(c[l]?'':' off')+'" data-l="'+l+'">'+l+'</button>'}).join("")+'</div>'}
function tabsHtml(){var all=view.s==="az"||view.s==="letter",n=all?words.length:words.filter(function(w){return (w.st||"p")===tab}).length;return '<div class="vrow"><p class="sub">'+(all?"All words":(tab==="p"?"Learning":"Learned"))+' · '+n+'</p>'+(view.s==="az"?'':'<div class="vt"><button data-vm="c" class="'+(vm==="c"?'on':'')+'">'+sc("Cards")+'</button><button data-vm="n" class="'+(vm==="n"?'on':'')+'">'+sc("Notepad")+'</button></div>')+'</div>'}
function tabsOld(){return '<div class="tabs"><button data-tab="p" class="'+(tab==="p"?"on":"")+'">Practice '+words.filter(function(w){return (w.st||"p")==="p"}).length+'</button><button data-tab="m" class="'+(tab==="m"?"on":"")+'">Mastered '+words.filter(function(w){return w.st==="m"}).length+'</button></div>'}
function bar(){var s=view.s,a=s==="add"?"add":s==="export"?"export":(s==="az"||s==="letter")?"az":(tab==="p"?"p":"m");
var I={p:'<svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',m:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>',az:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',add:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>',ex:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>'};
function b(k,at,ic,lb){return '<button '+at+' aria-label="'+lb+'" class="'+(a===k?'on':'')+'">'+ic+'<span>'+lb+'</span></button>'}
return '<nav class="nav">'+b("p",'data-tab="p"',I.p,"Learning")+b("m",'data-tab="m"',I.m,"Learned")+b("az",'data-go="az"',I.az,"A–Z")+b("add",'data-go="add"',I.add,"Add")+b("export",'data-go="export"',I.ex,"Data")+'</nav>'}
function barV2(){var s=view.s,a=(s==="letter"||s==="az")?"az":s==="add"?"add":s==="export"?"export":"home";function b(k,g,ic,lb){return '<button data-go="'+g+'" aria-label="'+lb+'" class="'+(a===k?'on':'')+'">'+ic+'</button>'}return '<nav class="nav">'+b("home","home","📚","Words")+b("az","az","🔤","A to Z")+b("add","add","➕","Add")+b("export","export","📤","Data")+'</nav>'}
function azView(){var c=counts();return tabsHtml()+'<div class="grid g4">'+letters().map(function(l){return '<button class="tile letter'+(c[l]?'':' off')+'" data-l="'+l+'"><b>'+l+'</b><small>'+(c[l]||0)+'</small></button>'}).join("")+'</div>'}
function barOld(){var c=counts(),cur=view.s==="letter"?view.l:"";return '<div class="bar"><div class="mini"><button data-go="home">⌂</button><button data-go="add">+ Add</button><button data-go="search">Search</button><button data-go="export">Data</button></div><div class="tabs"><button data-tab="p" class="'+(tab==="p"?"on":"")+'">Practice '+words.filter(function(w){return (w.st||"p")==="p"}).length+'</button><button data-tab="m" class="'+(tab==="m"?"on":"")+'">Mastered '+words.filter(function(w){return w.st==="m"}).length+'</button></div><div class="strip">'+letters().map(function(l){return '<button class="'+(l===cur?'on':'')+(c[l]?'':' off')+'" data-l="'+l+'">'+l+'</button>'}).join("")+'</div></div>'}
function home(){var q=(view.q||"").toLowerCase(),arr=q?words.filter(function(w){return (w.w+" "+w.m+" "+(w.s||"")+" "+(w.a||"")).toLowerCase().indexOf(q)>-1}):words.filter(inTab);return tabsHtml()+'<input id="q" placeholder="Search words…" value="'+esc(view.q||"")+'" autocomplete="off"><div id="res">'+list(arr,'Nothing here yet.')+'</div>'}
function homeOld2(){return '<h1>Vocab Cards</h1><p class="sub">'+words.length+' word'+(words.length===1?'':'s')+' saved</p>'+list(words.filter(inTab),'Nothing here yet. Tap + Add to start.')}
function homeOld(){var c=counts();
 return '<h1>Vocab Cards</h1><p class="sub">'+words.length+' word'+(words.length===1?'':'s')+' saved</p>'
 +'<div class="grid"><button class="tile" data-go="add"><b>Add word</b><small>Type it in</small></button><button class="tile" data-go="search"><b>Search</b><small>Find a word</small></button><button class="tile" data-go="export"><b>Data</b><small>Import &amp; export</small></button><button class="tile" data-go="all"><b>All words</b><small>A to Z list</small></button></div>'
 +'<h2>Browse by letter</h2><div class="grid g4">'+letters().map(function(l){return '<button class="tile letter'+(c[l]?'':' off')+'" data-l="'+l+'"><b>'+l+'</b><small>'+(c[l]||0)+'</small></button>'}).join("")+'</div>';
}

function list(arr,empty){lastArr=arr;if(!arr.length)return '<div class="empty">'+empty+'</div>';return vm==="n"?'<div class="pad">'+orderList(arr).map(lineHtml).join("")+'</div>':'<div class="cards">'+orderList(arr).map(cardHtml).join("")+'</div>'}

function exportTextOld(all){
 var h="These are all the words I’ve learned. Using only these words, create an interactive 50-question multiple-choice quiz for me. Ask one question at a time, give 4 options (A–D), tell me if I’m right after each answer, and show my score at the end.\n\nWORDS:\n";

function parseWords(txt){var out=[];String(txt||"").split(/\r?\n/).forEach(function(l){l=l.trim().replace(/^\d+[.)]\s+/,"");if(!l)return;var m=l.match(/^(.+?)\s+[\u2014\u2013-]\s+(.+)$/);if(!m)return;var head=m[1].trim(),rest=m[2],pos="",hm=head.match(/^(.+?)\s*\(([^)]+)\)\s*$/);if(hm){head=hm[1].trim();pos=hm[2].trim().toLowerCase()}if(POS.indexOf(pos)<0)pos="";var parts=rest.split(/\s+\|\s+/),o={w:head,m:(parts.shift()||"").trim(),p:pos,pr:"",e:"",s:"",a:""};parts.forEach(function(x){var k=x.match(/^(example|synonyms?|antonyms?|prep(?:osition)?s?)\s*:\s*(.*)$/i);if(!k)return;var n=k[1].toLowerCase().charAt(0);if(n==="e")o.e=k[2].trim();else if(n==="p")o.pr=k[2].trim();else if(n==="s")o.s=k[2].trim();else o.a=k[2].trim()});if(o.w&&o.m)out.push(o)});return out}
function importText(txt){var d=parseWords(txt),n=0,sk=0;d.forEach(function(x){if(words.some(function(z){return z.w.toLowerCase()===x.w.toLowerCase()})){sk++;return}x.id=Date.now()+n++;x.st="p";words.push(x)});if(!d.length)return toast("No words found in that text");save();tab="p";toast(n+" imported"+(sk?", "+sk+" skipped (already exist)":""));go("home")}

 return back()+'<h1>Data</h1><h2>Import words</h2><label>Paste words, one per line: word (pos) — meaning | Preposition: … | Example: … | Synonyms: … | Antonyms: …</label><textarea id="pt" placeholder="Paste words here"></textarea><div class="row"><button class="btn" id="it">Import words</button></div><h2>Export</h2><textarea id="ex" readonly style="min-height:220px">'+esc(words.length?exportText(true):"Add some words first.")+'</textarea>'

}
(function(){var tm=null,fired=false,sx=0,sy=0;

})();
function copy(t,msg){

 if(t.dataset.flip){var id=+t.dataset.flip,el=t;el.classList.add("flip");setTimeout(function(){peek={};if(flipped[id])flipped={};else{flipped={};flipped[id]=true}var tmp=document.createElement("div");tmp.innerHTML=cardHtml(words.filter(function(w){return w.id===id})[0]);var n=tmp.firstChild;n.classList.add("flip");el.replaceWith(n);reflow();var n2=document.getElementById("c"+id);if(n2){n2.classList.add("flip");requestAnimationFrame(function(){requestAnimationFrame(function(){n2.classList.remove("flip")})})}},150);return}
 if(t.dataset.p){var on=t.classList.contains("on");document.querySelectorAll("#fp button").forEach(function(b){b.classList.remove("on")});if(!on)t.classList.add("on");return}
 if(t.id==="save"){var w=document.getElementById("fw").value.trim(),m=document.getElementById("fm").value.trim();

  if(view.id){var x=words.filter(function(z){return z.id===view.id})[0];Object.assign(x,o)}
  else{if(words.some(function(z){return z.w.toLowerCase()===w.toLowerCase()}))return toast("That word already exists");o.id=Date.now();o.st="p";words.push(o)}
  if(!view.id)tab="p";save();toast("Saved");return go("letter",{l:first(o)})}
 if(t.id==="cp"){if(!words.length)return toast("Add some words first");if(!words.some(function(w){return w.st==="m"}))return toast("No learned words yet");return copy(exportText(),"Copied")}
